name: CI

# Two jobs. `unit` builds both applications and runs every unit / slice / ArchUnit test. `e2e` runs the whole end-to-end
# pass (backend/scripts/e2e/run-all.sh) against a real Postgres, with the real jars, PPOB1 and a real browser. Both must
# be green to merge. The e2e pass takes roughly 15 minutes, most of it the suites' own waits (a 60 s sweep tick, MFA
# time-steps, session timeouts), so it is not trimmed by running things in parallel: the suites share one database each.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: PPOB2 (compile, unit and slice tests, ArchUnit, bootJar)
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: PPOB1 simulator (compile, tests, bootJar)
        working-directory: ppob1-sim
        run: ./gradlew build --no-daemon

      - name: Keep the jars for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: jars
          retention-days: 3
          if-no-files-found: error
          path: |
            backend/app/build/libs/app-0.1.0-SNAPSHOT.jar
            ppob1-sim/build/libs/ppob1-sim-0.1.0-SNAPSHOT.jar

      - name: Test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 7
          path: |
            backend/**/build/reports/tests
            ppob1-sim/build/reports/tests

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ppob2
          POSTGRES_USER: ppob2
          POSTGRES_PASSWORD: ppob2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppob2 -d ppob2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: ppob2
      LOG_DIR: ${{ github.workspace }}/e2e-logs
      PPOB2_JAR: ${{ github.workspace }}/jars/backend/app/build/libs/app-0.1.0-SNAPSHOT.jar
      PPOB1_JAR: ${{ github.workspace }}/jars/ppob1-sim/build/libs/ppob1-sim-0.1.0-SNAPSHOT.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars

      - name: psql client and the browser the UI smoke test drives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: End-to-end pass (every suite, each group on a fresh database)
        run: backend/scripts/e2e/run-all.sh

      - name: Suite and application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          retention-days: 7
          if-no-files-found: ignore
          path: e2e-logs
