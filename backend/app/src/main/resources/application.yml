spring:
  application:
    name: ppob2
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${PPOB2_DB_URL:jdbc:postgresql://localhost:5432/ppob2}
    username: ${PPOB2_DB_USER:ppob2}
    password: ${PPOB2_DB_PASSWORD:ppob2}
    hikari:
      # Default is 30_000. Confirmed for real on 2026-09-27 (Postgres stopped under a running app):
      # a signed POST /api/v1/orders hung for the full 30s and THEN returned 500 — the opposite of
      # TC-BE-027's "requests fail fast with retryable error", and long enough that partner-side
      # timeouts and load-balancer health checks both fire before we answer. 5s is still comfortably
      # above normal pool-checkout latency (sub-millisecond when the pool is warm) while turning a
      # datastore outage into a prompt 503.
      connection-timeout: ${PPOB2_DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # Default is 1 thread shared by every @Scheduled job. With WebhookRetrySweepJob added
        # alongside QrExpirySweepJob, a single slow/timing-out webhook-delivery batch could occupy
        # that one thread long enough to delay the expiry sweep too. Two threads means the two jobs
        # no longer contend for the same slot.
        # Now 5: one thread per @Scheduled job (QrExpirySweepJob, WebhookRetrySweepJob, the hourly
        # admin-session purge and the two pattern-economics jobs). The purge is one fast DELETE and would be fine on a shared thread, but the
        # invariant "no job can be starved by another" is worth more than a thread, and it is simpler to
        # keep true than to remember which job is the exception.
        size: 5

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ppob2:
  # The business-day boundary for the WHOLE platform: settlement windows, daily usage quotas,
  # reconciliation dates and order-number date parts. Before this existed there was no definition
  # at all -- seven LocalDate.now() call sites took the JVM default zone, and two settlement
  # queries grouped with `paid_at::date`, whose cast runs in the Postgres SESSION timezone (set by
  # the JDBC driver from that same JVM default, NOT from hibernate.jdbc.time_zone below). The same
  # payment data therefore produced a different expected_amount depending on the deploying host's
  # TZ. See BusinessTimeConfig for the verified demonstration.
  #
  # Defaults to UTC because that reproduces the behaviour this codebase already had, so making the
  # boundary explicit does not silently move anyone's settlement figures. Asia/Jakarta is very
  # likely correct for an Indonesian platform -- but Section 37.1 flags the settlement schedule and
  # cutoff rules as "must be verified against latest Ayolinx contract", so set it once that is
  # confirmed rather than inheriting a guess. NOT the same thing as
  # ppob2.payment.ayolinx.timezone, which only formats timestamps in Ayolinx API payloads.
  business-zone: ${PPOB2_BUSINESS_ZONE:UTC}
  security:
    signature-window-ms: 300000 # 5 minutes, PRD Section 23.2
    # Key ring encrypting partner HMAC secrets and webhook secrets at rest (SecretVault). REQUIRED, no default:
    # `k1:<openssl rand -base64 32>[,k2:...]`. To rotate, add a key, point the active id at it, keep the old one
    # listed until every secret has been re-provisioned. Losing a listed key makes its secrets unrecoverable.
    secret-keys: ${PPOB2_SECRET_KEYS:}
    active-secret-key-id: ${PPOB2_SECRET_ACTIVE_KEY_ID:}
  channel:
    default-application-id: PPOB1-DEFAULT
  payment:
    # "stub" (default — StubQrisPaymentGateway, no real HTTP call) or "ayolinx" (AyolinxPaymentGateway,
    # real doc.ayolinx.id calls — needs every ayolinx.* property below plus real merchant credentials).
    gateway: ${PPOB2_PAYMENT_GATEWAY:stub}
    # Section 25.2's "Ayolinx-provided secret" — only used by the dev stub's own invented callback
    # scheme (StubQrisPaymentGateway's Javadoc); AyolinxPaymentGateway uses ayolinx.public-key-pem instead.
    ayolinx-webhook-secret: ${PPOB2_AYOLINX_WEBHOOK_SECRET:dev-webhook-secret}
    ayolinx:
      # https://sandbox.ayolinx.id (sandbox) or https://openapi.ayolinx.id (production).
      base-url: ${PPOB2_AYOLINX_BASE_URL:https://sandbox.ayolinx.id}
      # X-PARTNER-ID / X-CLIENT-KEY — issued post-KYB via the merchant dashboard, see backend/README.md.
      client-key: ${PPOB2_AYOLINX_CLIENT_KEY:}
      # Shared secret for the HMAC-SHA512 API request signature (AyolinxSigner.signApiRequest).
      client-secret: ${PPOB2_AYOLINX_CLIENT_SECRET:}
      # PKCS8 PEM, our own RSA private key (generated via `openssl genpkey`) — signs the B2B token request.
      private-key-pem: ${PPOB2_AYOLINX_PRIVATE_KEY_PEM:}
      # X.509 PEM, Ayolinx's RSA public key — verifies inbound callback signatures.
      public-key-pem: ${PPOB2_AYOLINX_PUBLIC_KEY_PEM:}
      channel: ${PPOB2_AYOLINX_CHANNEL:BNC_QRIS}
      # Registered in each Generate QRIS call's urlParams; must be this app's own reachable /internal/webhooks/ayolinx URL.
      notification-url: ${PPOB2_AYOLINX_NOTIFICATION_URL:}
      # Confirmed 2026-09-14 against a real Ayolinx sandbox callback: Ayolinx signs against the
      # merchant-supplied callback URL's own path, not a fixed Ayolinx-hosted doc path. See
      # AyolinxPaymentGateway's Javadoc / backend/README.md's "Inbound callback path" entry.
      callback-route: ${PPOB2_AYOLINX_CALLBACK_ROUTE:/internal/webhooks/ayolinx}
      timezone: ${PPOB2_AYOLINX_TIMEZONE:Asia/Jakarta}
  admin:
    # Section 42.3. HTTP Basic carries no TOTP, so while it is on, MFA is bypassed for whoever uses it.
    # OFF by default; the dev seed and the e2e suites (which authenticate with `curl -u`) need it ON.
    basic-auth-enabled: ${PPOB2_ADMIN_BASIC_AUTH_ENABLED:false}
    session:
      idle-timeout: ${PPOB2_ADMIN_SESSION_IDLE_TIMEOUT:PT30M}
      absolute-timeout: ${PPOB2_ADMIN_SESSION_ABSOLUTE_TIMEOUT:PT8H}
      pending-timeout: ${PPOB2_ADMIN_SESSION_PENDING_TIMEOUT:PT5M}
      # Browsers only keep a Secure cookie over HTTPS (localhost excepted). False only for plain-HTTP runs.
      cookie-secure: ${PPOB2_ADMIN_COOKIE_SECURE:true}
    mfa:
      # base64 of 32 random bytes: `openssl rand -base64 32`. Blank = MFA enrolment unavailable.
      encryption-key: ${PPOB2_ADMIN_MFA_ENCRYPTION_KEY:}
      max-attempts: ${PPOB2_ADMIN_MFA_MAX_ATTEMPTS:5}
    login:
      max-failures: ${PPOB2_ADMIN_LOGIN_MAX_FAILURES:5}
      lockout: ${PPOB2_ADMIN_LOGIN_LOCKOUT:PT15M}
  webhook:
    # Section 23.8: how often WebhookRetrySweepJob checks for due webhook_delivery rows.
    retry-sweep-interval-ms: ${PPOB2_WEBHOOK_RETRY_SWEEP_INTERVAL_MS:60000}
    # Delay *between* retry attempts (minutes), comma-separated — NOT the attempt count itself.
    # Total attempts = this list's length + 1 (the first, synchronous attempt). Default (5,60,240,1080)
    # gives 5 total attempts spanning ~23h, matching Section 23.8's "e.g. 5 attempts over 24h".
    retry-backoff-minutes: ${PPOB2_WEBHOOK_RETRY_BACKOFF_MINUTES:5,60,240,1080}
