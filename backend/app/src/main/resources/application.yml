spring:
  application:
    name: ppob2
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${PPOB2_DB_URL:jdbc:postgresql://localhost:5432/ppob2}
    username: ${PPOB2_DB_USER:ppob2}
    password: ${PPOB2_DB_PASSWORD:ppob2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # Default is 1 thread shared by every @Scheduled job. With WebhookRetrySweepJob added
        # alongside QrExpirySweepJob, a single slow/timing-out webhook-delivery batch could occupy
        # that one thread long enough to delay the expiry sweep too. Two threads means the two jobs
        # no longer contend for the same slot.
        size: 2

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ppob2:
  security:
    signature-window-ms: 300000 # 5 minutes, PRD Section 23.2
  channel:
    default-application-id: PPOB1-DEFAULT
  payment:
    # "stub" (default — StubQrisPaymentGateway, no real HTTP call) or "ayolinx" (AyolinxPaymentGateway,
    # real doc.ayolinx.id calls — needs every ayolinx.* property below plus real merchant credentials).
    gateway: ${PPOB2_PAYMENT_GATEWAY:stub}
    # Section 25.2's "Ayolinx-provided secret" — only used by the dev stub's own invented callback
    # scheme (StubQrisPaymentGateway's Javadoc); AyolinxPaymentGateway uses ayolinx.public-key-pem instead.
    ayolinx-webhook-secret: ${PPOB2_AYOLINX_WEBHOOK_SECRET:dev-webhook-secret}
    ayolinx:
      # https://sandbox.ayolinx.id (sandbox) or https://openapi.ayolinx.id (production).
      base-url: ${PPOB2_AYOLINX_BASE_URL:https://sandbox.ayolinx.id}
      # X-PARTNER-ID / X-CLIENT-KEY — issued post-KYB via the merchant dashboard, see backend/README.md.
      client-key: ${PPOB2_AYOLINX_CLIENT_KEY:}
      # Shared secret for the HMAC-SHA512 API request signature (AyolinxSigner.signApiRequest).
      client-secret: ${PPOB2_AYOLINX_CLIENT_SECRET:}
      # PKCS8 PEM, our own RSA private key (generated via `openssl genpkey`) — signs the B2B token request.
      private-key-pem: ${PPOB2_AYOLINX_PRIVATE_KEY_PEM:}
      # X.509 PEM, Ayolinx's RSA public key — verifies inbound callback signatures.
      public-key-pem: ${PPOB2_AYOLINX_PUBLIC_KEY_PEM:}
      channel: ${PPOB2_AYOLINX_CHANNEL:BNC_QRIS}
      # Registered in each Generate QRIS call's urlParams; must be this app's own reachable /internal/webhooks/ayolinx URL.
      notification-url: ${PPOB2_AYOLINX_NOTIFICATION_URL:}
      # See AyolinxPaymentGateway's Javadoc "Known unknowns" — genuinely undocumented, this is a best-effort default.
      callback-route: ${PPOB2_AYOLINX_CALLBACK_ROUTE:/v1/qr/qr-mpm-notify}
      timezone: ${PPOB2_AYOLINX_TIMEZONE:Asia/Jakarta}
  webhook:
    # Section 23.8: how often WebhookRetrySweepJob checks for due webhook_delivery rows.
    retry-sweep-interval-ms: ${PPOB2_WEBHOOK_RETRY_SWEEP_INTERVAL_MS:60000}
    # Delay *between* retry attempts (minutes), comma-separated — NOT the attempt count itself.
    # Total attempts = this list's length + 1 (the first, synchronous attempt). Default (5,60,240,1080)
    # gives 5 total attempts spanning ~23h, matching Section 23.8's "e.g. 5 attempts over 24h".
    retry-backoff-minutes: ${PPOB2_WEBHOOK_RETRY_BACKOFF_MINUTES:5,60,240,1080}
